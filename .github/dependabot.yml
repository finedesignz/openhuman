# Dependabot config: grouped updates on a staggered weekly cadence.
# Goal: collapse the per-dependency PR storm into a few grouped PRs per
# week, in this repo's own CI slot. Security updates are grouped too via applies-to: security-updates,
# since schedule and open-pull-requests-limit do not apply to them.
version: 2
# CI-load staggering: every repo in the org gets ONE weekly Dependabot slot so the
# shared Woodpecker pool is never hit by many repos at once.
# Slot rule (deterministic, reproducible for new repos):
#   h    = FNV-1a 32-bit hash of the lowercase repo name (name only, no owner)
#   slot = h % 140, linear-probed +1 (mod 140) while the slot is already claimed,
#          repos processed in ascending lowercase-repo-name order
#   day  = [monday..sunday][slot % 7]
#   hour = 2 + (floor(slot / 7) % 20)      -> 02:00..21:00 America/Los_Angeles
# Security updates are unaffected -- Dependabot ignores `schedule` for those.
updates:
  - package-ecosystem: "npm"
    rebase-strategy: "disabled"
    directories:
      - "/"
      - "/app"
      - "/packages/npm"
      - "/remotion"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "05:00"
      timezone: "America/Los_Angeles"
    open-pull-requests-limit: 3
    groups:
      all-dependencies:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      major-updates:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "major"
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: "cargo"
    rebase-strategy: "disabled"
    directories:
      - "/"
      - "/app/src-tauri"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "05:00"
      timezone: "America/Los_Angeles"
    open-pull-requests-limit: 3
    groups:
      all-dependencies:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      major-updates:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "major"
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: "docker"
    rebase-strategy: "disabled"
    directories:
      - "/"
      - "/.github"
      - "/e2e"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "05:00"
      timezone: "America/Los_Angeles"
    open-pull-requests-limit: 3
    groups:
      all-dependencies:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      major-updates:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "major"
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    rebase-strategy: "disabled"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "05:00"
      timezone: "America/Los_Angeles"
    open-pull-requests-limit: 3
    groups:
      all-dependencies:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      major-updates:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "major"
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"
