# Dependabot config: grouped updates on a monthly cadence.
# Goal: collapse the per-dependency PR storm into a few grouped PRs per
# month. Security updates are grouped too via applies-to: security-updates,
# since schedule and open-pull-requests-limit do not apply to them.
version: 2
updates:
  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/app"
      - "/packages/npm"
      - "/remotion"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    groups:
      all-dependencies:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      major-updates:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "major"
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: "cargo"
    directories:
      - "/"
      - "/app/src-tauri"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    groups:
      all-dependencies:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      major-updates:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "major"
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directories:
      - "/"
      - "/.github"
      - "/e2e"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    groups:
      all-dependencies:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      major-updates:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "major"
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    groups:
      all-dependencies:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      major-updates:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "major"
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"
